<text x="1090" y="344" font-size="14" fill="#e8e8e8" font-weight="bold" xml:space="preserve">ALTERNATİF 3 — FİKİR</text>
<text x="1090" y="363" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve"></text>
<text x="1090" y="382" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">1. Yatağın ayak ucu pencereye bakıyor:</text>
<text x="1090" y="401" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   uyanınca ilk gördüğün MANZARA.</text>
<text x="1090" y="420" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">2. Banyo sol üstte, yatak başı duvarının</text>
<text x="1090" y="439" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   arkasında; tesisat sol dış duvarda.</text>
<text x="1090" y="458" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">3. Banyo ~3 m²: v2'den büyük, klozet önü</text>
<text x="1090" y="477" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   85 cm, lavabo + 90x90 duş rahat.</text>
<text x="1090" y="496" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">4. Jakuzi yine manzara köşesinde, açık;</text>
<text x="1090" y="515" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   cam korkuluk ile merdivenden ayrılır.</text>
<text x="1090" y="534" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">5. Gardırop sol duvarda, merdiven çıkışı</text>
<text x="1090" y="553" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   ve banyo kapısı ortak geçişte.</text>
<text x="1090" y="572" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve"></text>
<text x="1090" y="591" font-size="14" fill="#e8e8e8" font-weight="bold" xml:space="preserve">DİKKAT</text>
<text x="1090" y="610" font-size="12" fill="#f0c080" font-weight="normal" xml:space="preserve">• Yatak ayak ucunda 50 cm kalıyor (dar).</text>
<text x="1090" y="629" font-size="12" fill="#f0c080" font-weight="normal" xml:space="preserve">• Banyo ile jakuzi ayrı köşelerde → iki</text>
<text x="1090" y="648" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">  ayrı tesisat hattı, maliyet biraz artar.</text>
<text x="1090" y="667" font-size="12" fill="#f0c080" font-weight="normal" xml:space="preserve">• Açık jakuzi: aspiratör / nem alma şart.</text>
<text x="1090" y="686" font-size="12" fill="#f0c080" font-weight="normal" xml:space="preserve">• Jakuzi merdiven kenarında: statik kontrol.</text>
</svg>