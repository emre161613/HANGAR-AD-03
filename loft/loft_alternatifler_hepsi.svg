<rect x="20" y="80" width="470" height="510" fill="none" stroke="#3a4552" stroke-width="1"/>
<text x="255.0" y="614" font-size="16" font-weight="bold" fill="#e8e8e8" text-anchor="middle">V1 · Kapalı banyo + köşe jakuzi</text>
<svg x="515" y="80" width="470" height="510" viewBox="40 30 1050 1140"><image href="loft_yerlesim_v2.png" xlink:href="loft_yerlesim_v2.png" width="1480" height="1180"/></svg>
<rect x="516" y="81" width="468" height="44" fill="#212830"/>
<rect x="515" y="80" width="470" height="510" fill="none" stroke="#3a4552" stroke-width="1"/>
<text x="750.0" y="614" font-size="16" font-weight="bold" fill="#e8e8e8" text-anchor="middle">V2 · Manzaraya bakan açık jakuzi</text>
<svg x="1010" y="80" width="470" height="510" viewBox="40 30 1050 1140"><image href="loft_yerlesim_v3.png" xlink:href="loft_yerlesim_v3.png" width="1480" height="1180"/></svg>
<rect x="1011" y="81" width="468" height="44" fill="#212830"/>
<rect x="1010" y="80" width="470" height="510" fill="none" stroke="#7fe08a" stroke-width="3"/>
<text x="1245.0" y="614" font-size="16" font-weight="bold" fill="#7fe08a" text-anchor="middle">V3 · Yatak manzaraya bakar  ★ ÖNERİM</text>
<svg x="20" y="635" width="470" height="510" viewBox="40 30 1050 1140"><image href="loft_yerlesim_v4.png" xlink:href="loft_yerlesim_v4.png" width="1480" height="1180"/></svg>
<rect x="21" y="636" width="468" height="44" fill="#212830"/>
<rect x="20" y="635" width="470" height="510" fill="none" stroke="#3a4552" stroke-width="1"/>
<text x="255.0" y="1169" font-size="16" font-weight="bold" fill="#e8e8e8" text-anchor="middle">V4 · Jakuzi pencere önünde</text>
<svg x="515" y="635" width="470" height="510" viewBox="40 30 1050 1140"><image href="loft_yerlesim_v5.png" xlink:href="loft_yerlesim_v5.png" width="1480" height="1180"/></svg>
<rect x="516" y="636" width="468" height="44" fill="#212830"/>
<rect x="515" y="635" width="470" height="510" fill="none" stroke="#3a4552" stroke-width="1"/>
<text x="750.0" y="1169" font-size="16" font-weight="bold" fill="#e8e8e8" text-anchor="middle">V5 · Kapalı spa banyo</text>
<text x="1010" y="653" font-size="17" font-weight="bold" fill="#e8e8e8">KARŞILAŞTIRMA</text>
<text x="1010" y="687" font-size="15" font-weight="bold" fill="#e8e8e8">V1</text>
<text x="1050" y="687" font-size="13" fill="#e8e8e8">+ Jakuzi köşede, banyoyla birlikte; cam bölme</text>
<text x="1050" y="706" font-size="13" fill="#f0c080">– Banyo 5.4 m² · jakuzide manzara zayıf</text>
<text x="1010" y="745" font-size="15" font-weight="bold" fill="#e8e8e8">V2</text>
<text x="1050" y="745" font-size="13" fill="#e8e8e8">+ Jakuzi manzara köşesinde, yanları açık</text>
<text x="1050" y="764" font-size="13" fill="#f0c080">– Banyo 2.1 m² (küçük) · buhar yatağa gelir</text>
<text x="1010" y="803" font-size="15" font-weight="bold" fill="#7fe08a">V3</text>
<text x="1050" y="803" font-size="13" fill="#e8e8e8">+ Jakuzi manzarada + yatak manzaraya bakar</text>
<text x="1050" y="822" font-size="13" fill="#f0c080">– Banyo 3 m² · iki ayrı tesisat hattı</text>
<text x="1010" y="861" font-size="15" font-weight="bold" fill="#e8e8e8">V4</text>
<text x="1050" y="861" font-size="13" fill="#e8e8e8">+ Jakuzi boydan pencerenin önünde</text>
<text x="1050" y="880" font-size="13" fill="#f0c080">– Banyo 2.3 m² · yatak tek taraftan inişli</text>
<text x="1010" y="919" font-size="15" font-weight="bold" fill="#e8e8e8">V5</text>
<text x="1050" y="919" font-size="13" fill="#e8e8e8">+ Her şey kapalı spa banyoda, oda kuru</text>
<text x="1050" y="938" font-size="13" fill="#f0c080">– Banyo 5.7 m² · jakuzide manzara YOK</text>
<text x="1010" y="983" font-size="12" fill="#e8e8e8">Önerim V3: jakuzi de yatak da manzaraya bakıyor,</text>
<text x="1010" y="1002" font-size="12" fill="#e8e8e8">banyo rahat (klozet önü 85 cm), geçişler 80+ cm.</text>
<text x="1010" y="1021" font-size="12" fill="#e8e8e8">Buhar istemiyorsan V5, en büyük banyo için V1.</text>
<text x="1010" y="1040" font-size="12" fill="#8a93a0">Ölçüler ekran görüntüsünden tahminidir.</text>
</svg>