<rect x="1090" y="185" width="26" height="12" fill="none" stroke="#d6d6d6" stroke-width="2"/>
<text x="1126" y="196" font-size="12" fill="#e8e8e8">Mevcut duvar / kolon</text>
<rect x="1090" y="211" width="26" height="12" fill="none" stroke="#ff5a5a" stroke-width="2"/>
<text x="1126" y="222" font-size="12" fill="#e8e8e8">Yeni bölme duvarı (10 cm)</text>
<rect x="1090" y="237" width="26" height="12" fill="none" stroke="#5cc8ff" stroke-width="2"/>
<text x="1126" y="248" font-size="12" fill="#e8e8e8">Cam bölme / duş camı / ayna</text>
<rect x="1090" y="263" width="26" height="12" fill="none" stroke="#e0a462" stroke-width="2"/>
<text x="1126" y="274" font-size="12" fill="#e8e8e8">Mobilya / vitrifiye</text>
<rect x="1090" y="289" width="26" height="12" fill="url(#wet)" stroke="#33404e"/>
<text x="1126" y="300" font-size="12" fill="#e8e8e8">Islak hacim (seramik)</text>
<text x="1090" y="344" font-size="14" fill="#e8e8e8" font-weight="bold" xml:space="preserve">NEDEN BU YERLEŞİM?</text>
<text x="1090" y="363" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve"></text>
<text x="1090" y="382" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">1. Tüm ıslak hacimler (jakuzi, duş, WC, lavabo)</text>
<text x="1090" y="401" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   tek blokta, sağ şeritte → tesisat kısa,</text>
<text x="1090" y="420" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   tek gider hattı, tek havalandırma.</text>
<text x="1090" y="439" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">2. Jakuzi sağ üst KÖŞEDE, kolonun dibinde.</text>
<text x="1090" y="458" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   Dolu jakuzi ~500-600 kg → yük kolon/kirişe</text>
<text x="1090" y="477" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   en yakın noktada. Statik kontrol şart.</text>
<text x="1090" y="496" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">3. Jakuzi ile yatak arası CAM bölme:</text>
<text x="1090" y="515" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   yataktan jakuzi görünür (suit hissi).</text>
<text x="1090" y="534" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   İstenirse buzlu / akıllı cam / perde.</text>
<text x="1090" y="553" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">4. P1 penceresi banyoda → doğal ışık +</text>
<text x="1090" y="572" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   havalandırma; önü boş bırakıldı.</text>
<text x="1090" y="591" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">5. Merdiven çıkışı (sol alt) tamamen boş,</text>
<text x="1090" y="610" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   banyo kapısına ve yatağa direkt geçiş.</text>
<text x="1090" y="629" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">6. Banyo kapısı sürgülü (cebe giren) →</text>
<text x="1090" y="648" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   açılma alanı kaybı yok.</text>
<text x="1090" y="667" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">7. Yatak başı dış duvara (üst) dayalı,</text>
<text x="1090" y="686" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   iki yanda 45 cm komodin + geçiş.</text>
<text x="1090" y="705" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve"></text>
<text x="1090" y="724" font-size="14" fill="#e8e8e8" font-weight="bold" xml:space="preserve">DİKKAT</text>
<text x="1090" y="743" font-size="12" fill="#f0c080" font-weight="normal" xml:space="preserve">• Ölçüler ekran görüntüsünden tahminidir</text>
<text x="1090" y="762" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">  (iç ~410 x 375). Net ölçüyle revize edilir.</text>
<text x="1090" y="781" font-size="12" fill="#f0c080" font-weight="normal" xml:space="preserve">• Jakuzi için ayrı sigortalı hat + topraklama.</text>
<text x="1090" y="800" font-size="12" fill="#f0c080" font-weight="normal" xml:space="preserve">• Islak hacimde su yalıtımı + 2 cm kot farkı.</text>
<text x="1090" y="819" font-size="12" fill="#f0c080" font-weight="normal" xml:space="preserve">• 180'lik yatak istenirse: sağ komodin</text>
<text x="1090" y="838" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">  kaldırılır, duvara asma raf konur.</text>
