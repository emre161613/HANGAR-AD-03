<text x="1090" y="344" font-size="14" fill="#e8e8e8" font-weight="bold" xml:space="preserve">ALTERNATİF 5 — FİKİR</text>
<text x="1090" y="363" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve"></text>
<text x="1090" y="382" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">1. Jakuzi, duş, WC, lavabo hepsi tek büyük</text>
<text x="1090" y="401" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   KAPALI spa banyoda (~5.7 m²).</text>
<text x="1090" y="420" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">2. Buhar / nem / ses yatağa geçmez,</text>
<text x="1090" y="439" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   yatak odası tamamen kuru kalır.</text>
<text x="1090" y="458" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">3. Yatak sağda, P1 penceresinin yanında;</text>
<text x="1090" y="477" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   karşısında gardırop + TV duvarı.</text>
<text x="1090" y="496" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">4. Tüm tesisat sol dış duvar boyunca,</text>
<text x="1090" y="515" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   tek gider hattı → en ucuz çözüm.</text>
<text x="1090" y="534" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">5. Merdivenden çıkınca banyo kapısı</text>
<text x="1090" y="553" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   ve yatak odası ayrı ayrı erişilir.</text>
<text x="1090" y="572" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve"></text>
<text x="1090" y="591" font-size="14" fill="#e8e8e8" font-weight="bold" xml:space="preserve">DİKKAT</text>
<text x="1090" y="610" font-size="12" fill="#f0c080" font-weight="normal" xml:space="preserve">• Jakuzide manzara YOK (iç tarafta).</text>
<text x="1090" y="629" font-size="12" fill="#f0c080" font-weight="normal" xml:space="preserve">• Yatağın iki yanında sadece 20 cm:</text>
<text x="1090" y="648" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">  komodin yerine duvara asma raf.</text>
<text x="1090" y="667" font-size="12" fill="#f0c080" font-weight="normal" xml:space="preserve">• Jakuzi dolu ~400 kg: sol dış duvar</text>
<text x="1090" y="686" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">  boyunca, statik açıdan en güvenli yer.</text>
