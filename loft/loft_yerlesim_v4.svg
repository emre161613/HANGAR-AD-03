<text x="1090" y="344" font-size="14" fill="#e8e8e8" font-weight="bold" xml:space="preserve">ALTERNATİF 4 — FİKİR</text>
<text x="1090" y="363" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve"></text>
<text x="1090" y="382" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">1. Jakuzi tam P1 penceresinin önünde:</text>
<text x="1090" y="401" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   yatarken yanında boydan pencere.</text>
<text x="1090" y="420" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">2. Banyo üst duvar boyunca (duş, WC,</text>
<text x="1090" y="439" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   lavabo yan yana), kapı sağa açılır.</text>
<text x="1090" y="458" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">3. Yatak sol duvarda NİŞ gibi: ayak ucu</text>
<text x="1090" y="477" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   jakuziye ve pencereye bakıyor.</text>
<text x="1090" y="496" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">4. Gardırop sağ üst köşede, jakuzinin</text>
<text x="1090" y="515" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   arkasında; sağ alt köşe tamamen boş.</text>
<text x="1090" y="534" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">5. Merdiven çıkışından her yere 80+ cm.</text>
<text x="1090" y="553" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve"></text>
<text x="1090" y="572" font-size="14" fill="#e8e8e8" font-weight="bold" xml:space="preserve">DİKKAT</text>
<text x="1090" y="591" font-size="12" fill="#f0c080" font-weight="normal" xml:space="preserve">• Yatak bir uzun kenarıyla banyo duvarına</text>
<text x="1090" y="610" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">  dayalı → tek taraftan inilir, komodin yok.</text>
<text x="1090" y="629" font-size="12" fill="#f0c080" font-weight="normal" xml:space="preserve">• Jakuzi pencereyi kapatır: P1 kapı/Fransız</text>
<text x="1090" y="648" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">  balkon ise kullanılamaz, sadece manzara.</text>
<text x="1090" y="667" font-size="12" fill="#f0c080" font-weight="normal" xml:space="preserve">• Banyo dar (~2.3 m²) ama 3 parça sığıyor.</text>
<text x="1090" y="686" font-size="12" fill="#f0c080" font-weight="normal" xml:space="preserve">• Açık jakuzi: aspiratör / nem alma şart.</text>
</svg>