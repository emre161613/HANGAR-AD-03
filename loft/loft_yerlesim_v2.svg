<text x="1090" y="344" font-size="14" fill="#e8e8e8" font-weight="bold" xml:space="preserve">BU VERSİYONDA NE DEĞİŞTİ?</text>
<text x="1090" y="363" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve"></text>
<text x="1090" y="382" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">1. Jakuzi, duşun olduğu yere (manzara</text>
<text x="1090" y="401" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   tarafına) alındı. Başlık batıda →</text>
<text x="1090" y="420" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   otururken yüzün direkt manzaraya.</text>
<text x="1090" y="439" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">2. Jakuzinin yanlarında duvar YOK:</text>
<text x="1090" y="458" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   yatak + jakuzi + manzara tek mekân.</text>
<text x="1090" y="477" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   Yataktan da manzara görünüyor.</text>
<text x="1090" y="496" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">3. Merdiven boşluğu tarafına duvar yerine</text>
<text x="1090" y="515" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   CAM KORKULUK → güvenlik var, görüş açık.</text>
<text x="1090" y="534" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">4. WC + duş + lavabo sağ üst köşede küçük</text>
<text x="1090" y="553" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   kapalı banyoda; jakuzi ile aynı tesisat</text>
<text x="1090" y="572" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   hattında. Kapı sürgülü.</text>
<text x="1090" y="591" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">5. P1 penceresinin önü boş, açık alanı</text>
<text x="1090" y="610" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">   aydınlatıyor. Merdiven çıkışı serbest.</text>
<text x="1090" y="629" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve"></text>
<text x="1090" y="648" font-size="14" fill="#e8e8e8" font-weight="bold" xml:space="preserve">DİKKAT</text>
<text x="1090" y="667" font-size="12" fill="#f0c080" font-weight="normal" xml:space="preserve">• Açık jakuzi buharı yatağa gelir: güçlü</text>
<text x="1090" y="686" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">  aspiratör / nem alma + jakuzi kapağı şart.</text>
<text x="1090" y="705" font-size="12" fill="#f0c080" font-weight="normal" xml:space="preserve">• Jakuzi çevresi ~1 m sıçrama alanı: seramik</text>
<text x="1090" y="724" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">  + su yalıtımı, parke ile arası şeritle ayrılır.</text>
<text x="1090" y="743" font-size="12" fill="#f0c080" font-weight="normal" xml:space="preserve">• Jakuzi merdiven boşluğu kenarında: dolu</text>
<text x="1090" y="762" font-size="12" fill="#e8e8e8" font-weight="normal" xml:space="preserve">  ~500-600 kg → kenar kirişi statik kontrol!</text>
<text x="1090" y="781" font-size="12" fill="#f0c080" font-weight="normal" xml:space="preserve">• Ölçüler ekran görüntüsünden tahminidir.</text>
</svg>